<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./static/styles/styles.css" />
  <title>Register — WC 2026</title>
</head>
<body>
  <div id="wrapper">
    <header>
      <div style="font-family:'Oswald',sans-serif;font-size:20px;font-weight:700;letter-spacing:2px;color:#FFD700;">⚽ WC 2026</div>
      <nav>
        <div><a href="#">Home</a><a href="#">Dashboard</a></div>
        <div class="guest"><a href="#">Login</a><a href="#">Register</a></div>
      </nav>
    </header>
    <main class="register">
      <section id="register">
        <div class="form">
          <h2>⚽ Register</h2>
          <form class="register-form" action="#" method="POST">
            <input type="text" id="email" name="email" placeholder="Email" />
            <input type="password" id="password" name="password" placeholder="Password" />
            <input type="password" id="repeat-password" name="rePassword" placeholder="Repeat Password" />
            <button type="submit">Register</button>
            <p class="message">Already have an account? <a href="#">Login</a></p>
          </form>
        </div>
      </section>
    </main>
    <footer>World Cup 2026 Tracker &copy; SoftUni JS Back-End Exam 2026</footer>
  </div>
</body>
</html>
